server:
  port: 8080
spring:
  application:
    name: cement-factory
  datasource:
    url: jdbc:h2:file:./data/cementdb;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
app:
  cors-origins: http://localhost:3000
